name: Bootstrap VFA repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and sanitize portfolio release
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No ZIP release found in repository root."
            exit 1
          fi

          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          SRC="$TMP"
          if [ ! -f "$SRC/package.json" ]; then
            TOP="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d -print -quit || true)"
            if [ -n "$TOP" ] && [ -f "$TOP/package.json" ]; then
              SRC="$TOP"
            fi
          fi

          if [ ! -f "$SRC/package.json" ] || [ ! -d "$SRC/src" ]; then
            echo "The ZIP does not look like the expected Astro repository."
            exit 1
          fi

          # Keep only files useful to build/present the public portfolio.
          rm -rf "$SRC/.github" "$SRC/docs/before-after"
          rm -f             "$SRC/.editorconfig"             "$SRC/.gitattributes"             "$SRC/BUILD_VERIFICATION.txt"             "$SRC/RELEASE_MANIFEST.txt"             "$SRC/DEPLOY_GITHUB_PAGES.md"             "$SRC/docs/SVILUPPO.md"             "$SRC/public/_redirects"             "$SRC/scripts/cv-pdf.mjs"             "$SRC/scripts/favicons.mjs"             "$SRC/scripts/passion-images.mjs"             "$SRC/scripts/validate-release.mjs"             "$SRC/src/assets/portrait/banner.png"             "$SRC/src/assets/portrait/portrait-square.jpg"             "$SRC/src/assets/portrait/portrait.jpg"

          find "$SRC" -name '.DS_Store' -delete

          python3 - "$SRC" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])

          # Third-party tutor names are unnecessary public data.
          exp = root / "src/data/experiences.ts"
          s = exp.read_text(encoding="utf-8")
          s = re.sub(r"^\s*tutor:\s*'[^']+',\s*\n", "", s, flags=re.M)
          exp.write_text(s, encoding="utf-8")

          # README: remove references to internal QA/development material.
          readme = root / "README.md"
          s = readme.read_text(encoding="utf-8")
          s = s.replace(" (see `docs/SVILUPPO.md`)", "")
          s = re.sub(
              r"\nAll screenshots are real captures of the production build \(`docs/images/`\)\. Before/after comparisons[^\n]*\n",
              "\nAll screenshots are real captures of the production build (`docs/images/`).\n",
              s,
          )
          s = s.replace(
              "docs/                SVILUPPO.md (Italian development notes), images/ (README screenshots)",
              "docs/                images/ (README screenshots)",
          )
          s = re.sub(
              r" Step-by-step instructions, including a browser-only path, are in \[DEPLOY_GITHUB_PAGES\.md\]\(DEPLOY_GITHUB_PAGES\.md\)\.",
              " Deployment runs automatically through GitHub Actions.",
              s,
          )
          readme.write_text(s, encoding="utf-8")

          # The site is hosted on GitHub Pages, not Cloudflare Pages.
          for lang in ("it", "en", "pl"):
              path = root / f"src/i18n/locales/{lang}.json"
              data = path.read_text(encoding="utf-8").replace("Cloudflare Pages", "GitHub Pages")
              path.write_text(data, encoding="utf-8")
              json.loads(data)
          PY

          ZIP_BASENAME="$(basename "$ZIP")"

          # Preserve .git and the bootstrap workflow while importing sanitized source.
          find . -mindepth 1 -maxdepth 1             ! -name '.git'             ! -name '.github'             ! -name "$ZIP_BASENAME"             -exec rm -rf {} +

          cp -a "$SRC"/. .
          rm -f "$ZIP_BASENAME"

          test -f .github/workflows/bootstrap.yml
          test -f src/scripts/main.ts
          test -f scripts/postbuild.mjs
          test -d src/pages
          test -d src/styles

          test ! -e BUILD_VERIFICATION.txt
          test ! -e RELEASE_MANIFEST.txt
          test ! -e DEPLOY_GITHUB_PAGES.md
          test ! -e docs/SVILUPPO.md
          test ! -e docs/before-after
          test ! -e src/assets/portrait/banner.png
          test ! -e src/assets/portrait/portrait-square.jpg
          test ! -e src/assets/portrait/portrait.jpg

      - name: Commit sanitized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Import sanitized VFA portfolio release"
          git push origin HEAD:main
