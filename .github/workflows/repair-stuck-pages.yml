# One-time repair. This workflow only runs when this file is changed
# or manually dispatched; it does not publish the website itself.
name: Ripara pubblicazione Pages bloccata

on:
  push:
    paths:
      - ".github/workflows/repair-stuck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: write

concurrency:
  group: pages-repair
  cancel-in-progress: true

jobs:
  release-blocked-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the stalled GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STUCK_RUN_ID: "42097856702"
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${REPO}/actions/runs/${STUCK_RUN_ID}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          state="$(curl -fsSL "${headers[@]}" "${url}" | jq -r '.status // "unknown"')"
          echo "Stalled Pages run ${STUCK_RUN_ID} state: ${state}"
          case "${state}" in
            completed)
              echo "Already finished; no cancellation needed."
              ;;
            queued|in_progress|waiting|pending|requested)
              response="$(mktemp)"
              code="$(curl -sSL -X POST "${headers[@]}" -o "${response}" -w '%{http_code}' "${url}/cancel")"
              case "${code}" in
                202|204) echo "Cancellation accepted, allowing the latest Pages build to proceed." ;;
                409) echo "Run completed before cancellation could be applied." ;;
                *) echo "::error::Cancel request failed with HTTP ${code}"; cat "${response}"; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::Unknown run state: ${state}"
              exit 1
              ;;
          esac
