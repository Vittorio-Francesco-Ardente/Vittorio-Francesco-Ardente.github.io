name: Audit responsive temporaneo
on:
  push:
    paths:
      - 'scripts/audit_responsive.cjs'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa Playwright
        run: |
          npm install --prefix /tmp/vfa-audit playwright@1.56.1
          if ! command -v google-chrome && ! command -v chromium; then
            /tmp/vfa-audit/node_modules/.bin/playwright install chromium
          fi
      - name: Server locale
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vfa-server.log 2>&1 &
          sleep 3
      - name: Controlla layout e cattura screenshot
        env:
          NODE_PATH: /tmp/vfa-audit/node_modules
        run: node scripts/audit_responsive.cjs
