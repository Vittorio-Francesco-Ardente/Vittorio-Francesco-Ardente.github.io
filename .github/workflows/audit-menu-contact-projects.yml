name: Verifica correzioni mobile (temporaneo)
on:
  push:
    paths:
      - 'scripts/audit_menu_contact_projects.cjs'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dipendenze browser
        run: npm install --prefix /tmp/vfa-audit playwright@1.56.1
      - name: Server di test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vfa-server.log 2>&1 &
          sleep 2
      - name: Controllo effettivo delle pagine
        env:
          NODE_PATH: /tmp/vfa-audit/node_modules
        run: node scripts/audit_menu_contact_projects.cjs
