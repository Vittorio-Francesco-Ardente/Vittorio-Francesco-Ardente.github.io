name: QA footer e pass mobile (temporaneo)
on:
  push:
    paths:
      - 'scripts/audit_footer_pass.cjs'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser
        run: npm install --prefix /tmp/vfa-audit playwright@1.56.1
      - name: Server portfolio
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vfa-audit.log 2>&1 &
          sleep 3
      - name: Test footer pass e screenshot
        env:
          NODE_PATH: /tmp/vfa-audit/node_modules
        run: node scripts/audit_footer_pass.cjs
