# Disabilitata: anteprima con immagine fissa og/og-base.jpg.
# La procedura e lo script scripts/og_tema.py restano nel repository per un eventuale ripristino.
name: Anteprima link stagionale (disabilitata)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/og_tema.py
      - name: Commit se cambia
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "og-stagionale"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Anteprima link: tema del giorno"
            git push
          fi
