name: Crea anteprima nitida (una sola volta)
on:
  push:
    paths:
      - 'scripts/og_nitido.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installazione strumenti immagine
        run: python -m pip install pillow fonttools brotli
      - name: Crea PNG nitido da risorse del repository
        run: python scripts/og_nitido.py
      - name: Salva l'immagine nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og/og-base-nitido.png
          if ! git diff --cached --quiet; then
            git commit -m "Aggiunge anteprima LinkedIn PNG nitida"
            git push
          fi
